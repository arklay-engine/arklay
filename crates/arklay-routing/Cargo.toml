[package]
name = "arklay-routing"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "BioRand's key-placement routing, ported from biorand/common for arklay"
license = "MIT"

# Common's routing on its own, as in the C#, where it lives in
# BioRand.Common rather than the randomizer: editing it recompiles only this
# crate and arklay-biorand (see AGENTS.md).
[dependencies]
indexmap = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
warnings = "deny"
