[package]
name = "arklay-biorand"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "BioRand's RE1 randomizer, ported from biorand/classic for arklay"
license = "MIT"

# A pure library: no engine, SDL or pack types, so iterating on the generator
# never recompiles the engine crate's 250k lines (see AGENTS.md).
[dependencies]
anyhow = "1"
indexmap = "2"
# "positions" gives the byte ranges that the parser's error lines come from.
roxmltree = { version = "0.21", default-features = false, features = ["std", "positions"] }
serde_json = "1"

[lints.rust]
warnings = "deny"
