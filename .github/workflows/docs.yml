name: Docs

# Builds the mdbook in docs/ and publishes it to GitHub Pages on every push to
# main. Pull requests build it too, so a broken book, or Lua API definitions
# that no longer match the engine, fail before merge.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "lua-types/**"
      - "scripts/lua-api-doc.py"
      - "scripts/opcode-index.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A deployment already running is left to finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The Lua API pages come from lua-types/*.lua; fail when they and the
      # methods the engine registers have drifted apart.
      - name: Check the Lua API definitions
        run: python3 scripts/lua-api-doc.py check
      - name: Build the book
        run: mdbook build docs
      # The Lua definition files, next to the pages that document them.
      - name: Publish the Lua definition files
        run: |
          mkdir -p target/book/lua-types
          cp lua-types/*.lua target/book/lua-types/
          (cd lua-types && zip -q ../target/book/arklay-lua-types.zip *.lua)
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: target/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
