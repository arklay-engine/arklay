[package]
name = "arklay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A from-scratch engine for the classic Resident Evil games"
license = "MIT"

[features]
default = ["hd"]
# The replacement-format decoders an HD mod pack needs: PNG and WebP art, OGG
# Vorbis audio and H.264/AAC films. Art and audio are pure-Rust crates; the
# H.264 decoder is Cisco's BSD-licensed OpenH264, built from source by its
# crate (with its SIMD assembly when `nasm` is on the PATH). They are optional,
# so a `--no-default-features` build stays lean; such a build still resolves
# replacements by stem, but cannot decode the formats it does not carry.
hd = [
    "dep:image-webp",
    "dep:lewton",
    "dep:openh264",
    "dep:symphonia-codec-aac",
    "dep:symphonia-core",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
image-webp = { version = "0.2", optional = true }
lewton = { version = "0.10", optional = true }
mlua = { version = "0.10", default-features = false, features = [
    "lua54",
    "vendored",
] }
# 0.9.5 and later depend on `wide` 1.x, which needs a newer rustc than our
# MSRV.
openh264 = { version = "=0.9.3", optional = true }
# Always built: screenshots are written as PNG. Decoding PNG art is `hd`.
png = "0.18"
# The room definitions (`room/<id>/room.xml`).
roxmltree = { version = "0.21", default-features = false, features = ["std", "positions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sdl3-sys = { version = "0.7", default-features = false }
symphonia-codec-aac = { version = "0.6", optional = true }
symphonia-core = { version = "0.6", default-features = false, optional = true }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zstd = "0.13"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[build-dependencies]
# The build script compiles the room scripts with the crate's own compiler.
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source-static"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints.rust]
warnings = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# OpenH264 is C++ built by the crate's build script, which follows the
# profile's opt-level; unoptimised it cannot decode an HD film in real time.
[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.release]
lto = "thin"

# Build scripts and proc macros run optimised. The crate's build script
# compiles every room script and takes about 30s unoptimised against 5s
# optimised, and it runs again in every new worktree and after any change
# under `games/re1/` or `src/scd/` (#266).
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# The release-profile test build, and the one profile for every local test,
# build and run (see AGENTS.md): release-speed code without the slow parts of
# an optimised build. `lto = "off"` also turns off rustc's implicit thin-local
# LTO across codegen units, which redid about 48s of LLVM work after a
# one-line edit; 256 codegen units keep the units an edit invalidates small.
# Incremental compilation keeps the single-test edit loop at seconds (CI sets
# CARGO_INCREMENTAL=0; it builds cold anyway). Shipped binaries keep
# `[profile.release]`.
[profile.test-release]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
