# The Arklay documentation book: https://arklay-engine.github.io/arklay/
#
# Build locally with `mdbook serve docs` (or `mdbook build docs`) from the
# repository root. Every push to main publishes it through
# .github/workflows/docs.yml.

[book]
title = "Arklay"
description = "Documentation for the Arklay engine: game packs, mods, the Lua API and .akscr scripts."
authors = ["The Arklay contributors"]
language = "en"
# The pages live directly in docs/, next to the files the README already links.
src = "."

[build]
# Keep the output out of the source tree.
build-dir = "../target/book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/arklay-engine/arklay"
edit-url-template = "https://github.com/arklay-engine/arklay/edit/main/docs/{path}"
site-url = "/arklay/"
