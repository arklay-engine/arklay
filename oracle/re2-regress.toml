# Room 101's pick-ups from a new game: the shotgun from Kendo's body after the zombies' attack, and the
# handgun rounds on both shelves; then the shotgun fired out (oracle/re2.md, "Weapons"). No sound: the
# attack's voice lines end by DirectSound's clock in a --sound record ("On Windows").
[[run]]
name = "weapon_pickup_101"
room = "new"
offset = 0
sound = false
ticks = 7100
setup_script = "route_100_200.lua"
input = "weapon_pickup_101.txt"
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,inv,em"
# room 100's door, and the head after each get-item window and the status screen's close, 1 to 3 units
# high on the first ticks (oracle/re2.md, docs/re2-deviations.md, "The head after the get-item window")
ignore = [
    [790, "rng"],
    [790, "rseed"],
    [4611, "pneck"],
    [4612, "pneck"],
    [4613, "pneck"],
    [4614, "pneck"],
    [4615, "pneck"],
    [5471, "pneck"],
    [5472, "pneck"],
    [5473, "pneck"],
    [5474, "pneck"],
    [5475, "pneck"],
    [5476, "pneck"],
    [5477, "pneck"],
    [5478, "pneck"],
    [6141, "pneck"],
    [6142, "pneck"],
    [6143, "pneck"],
    [6144, "pneck"],
    [6145, "pneck"],
    [6377, "pneck"],
    [6378, "pneck"],
    [6379, "pneck"],
    [6380, "pneck"],
    [6381, "pneck"],
]
expect = "match"
record = "--no-enemies --keep-enemy-in 101:0 --flag 4:135"

# Room 200's handgun rounds on the counter, then a reload from them (oracle/re2.md, "Weapons").
[[run]]
