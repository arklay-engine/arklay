room = "200"
setup_script = "weapon_pickup_200.lua"
input = "weapon_pickup_200.txt"
input_shift = 344
ticks = 1300
fields = "item"
# no frames: from the warp the original's cut 0 is scrolled about 22 lines up, where arklay's --room start
