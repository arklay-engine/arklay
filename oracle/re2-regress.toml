# Regression runs for scripts/re2-regress.py (see "The regression runner" in oracle/re2.md).
#
# A run plays `input` in arklay and compares it with the stored recording of the original.
# `ticks` are the reference's; arklay runs `ticks - offset` of them, from the state the
# original has at its tick `offset`. `expect` is "match" or a known first divergence, as
# { tick = reference tick, fields = [...], note = "..." }. `record` is the rest of the
# `scripts/oracle-re2.py record` command that makes the reference (`--input`, `--ticks`,
# `--trace`, `--sound` and, when the run has frames, `--shot-dir` and `--shot-every 1` are
# added). Setup scripts and inputs are in oracle/inputs-re2/.

[defaults]
room = "102"
player = 0
character = 0
sound = true
offset = 344

[fields]
item = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,snd"
inv = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ip,snd"

[[run]]
name = "item_take"
setup_script = "item_102.lua"
input = "item_take_102_arklay.txt"
ticks = 1000
fields = "item"
frames = [360, 999]
frame_max_mean = 0.8
boxes = [[0, 165, 232, 240]]
expect = "match"
record = "--no-enemies --warp 102:-11378:0:-4587:0"

