# The main game's results (`Result_01`'s steps 0 to 7, and a B's 8 to 0x17 after the save): a new game in room 100
# with `fg_system`'s 0x200000 and no extra's bit, as Leon or Claire (arklay starts Claire's game for her runs: a room's
# start writes `fg_status`'s character bit from the game's) and in scenario A or B (flag 1:1). The clear time is
# `GameSeconds`, 0 on the first tick of a new game, so the time's and the saves' scores are 100 and the rank S.
# The pieces' words are Classic REbirth's English ones (its patched tables, `games/re2/ui/result.lua`).

# Leon A's: the film's 300 ticks, the picture with the rank, then the rocket launcher the time's score earns (step 6),
# up to the save screen's wait.
[[run]]
name = "result_leon_a"
room = "new"
offset = 0
ticks = 3300
setup_script = "result_main.lua"
input = "none.txt"
fields = "res,rest,rfade,rmus,bgm,snd,sv"
# As result_4th's.
ignore = [[0, "rfade"]]
frames = [0, 3299]
frame_max_mean = 0.2
expect = "match"
record = "--flag 0:10"

# Leon A's to the save screen, whose new file writes the next scenario's game: Claire B's, with the rocket launcher in
