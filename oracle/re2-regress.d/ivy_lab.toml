# The lab's ivies (#876).

# Room 60B on the first visit (flag 4:95 clear): two 0x2E ivies of kind 7 wait in state 11 until the panel's check
# (area 5, `main_03`, with flag 4:106) shakes the room and sets 4:95; then they come out, their vines lashing first.
# The player stands still and a whip takes their last life on 1265. Recorded for 2400 ticks; the game over returns to
# the title on 1649.
[[run]]
name = "ivy_60b_panel"
room = "60B"
sound = false
ticks = 1649
setup_script = "ivy_60b.lua"
input = "ivy_60b_panel.txt"
input_shift = 344
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,msg,zm0,zm1,zm2,zm3,zm4,zm5,zm6,zm7,zm8,zm9,fgstat"
expect = "match"
record = "--warp 60B:-14200:0:-21000:1536 --flag 4:106 --life 200"

