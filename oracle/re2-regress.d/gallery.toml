# DATA GALLERY's menu and its pictures from the title (oracle/re2.md, "The gallery"). Boot records, compared from the title's first tick.
# The frames' means are 0.04 to 0.07 measured; a window is the pictures' or the movies' own ticks.

[[run]]
name = "gallery_leon"
ui = "title"
offset = 189
ticks = 932
input = "gallery_leon.txt"
input_shift = 189
input_drop_early = true
fields = "ti,tlogo,tfade,tx,tfade2,tfade3,snd,gal"
frames = [189, 931]
frame_max_mean = 0.12
expect = "match"
record = ""

