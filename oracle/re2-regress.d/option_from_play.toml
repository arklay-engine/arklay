# The option screen entered from play (`Config`, 0x449FD0): `Game_loop` takes the option key (the raw pad's 0x100) under START's gate and leaves for it through game modes 1 and 2, `FUN_0044af00` keeps the player and gives them their handgun, `Config_main` runs as from the title, and `FUN_0044b020` puts the player back for game modes 3 and 5 (oracle/re2.md, "The option screen"). `opt` is the screen's trace and `gm` the game mode. The second run opens KEYCONFIG, whose model is the player themselves (`pPl`): `p` and `mot` follow it, with `kc` and `kcm`; its list shows config.ini's keys in the original, so it is recorded with `KeyDef` and `JoyDef_Emulated` at the executable's defaults, which arklay's page shows with no title before it. Its page differs in the model's draw, as the title's KEYCONFIG runs do (#807).

[[run]]
name = "option_from_play_201"
room = "201"
setup_script = "option_from_play_201.lua"
input = "option_from_play_201.txt"
input_shift = 344
input_drop_early = true
ticks = 1150
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,prep,snd,fgstat,gm,opt"
frames = [360, 1149]
frame_max_mean = 0.07
expect = "match"
record = "--no-enemies --warp 201:-14471:0:-24100:1024 --life 200"

