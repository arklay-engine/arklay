# A two-slot weapon taken in a room (`St_get_check`, `Set_item`; oracle/re2.md, "Two-slot weapons"): room 60F's sub-machine gun, by a press in its area, with the enemies off. `box` is the inventory's two-slot marks.

[[run]]
name = "two_slot_60f"
room = "60F"
setup_script = "two_slot_60f.lua"
input = "two_slot_60f.txt"
input_shift = 344
input_drop_early = true
ticks = 1200
fields = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,box,msg,snd,hk,fgstat,fgitem"
frames = [360, 1199]
frame_max_mean = 0.07
expect = "match"
record = "--no-enemies --warp 60F:-11960:0:-20830:0 --life 200 --give 2:0x14:30"

