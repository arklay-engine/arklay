# Locked and key doors past the main hall: Sce_Door's sounds, the key's use and Key_lost (oracle/re2.md, "Locked doors").

[[run]]
name = "key_door_20B"
room = "20B"
setup_script = "key_door_20B.lua"
input = "key_door_20B.txt"
input_shift = 344
ticks = 1000
fields = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,snd,msg,fgkey,fgstat"
frames = [360, 999]
frame_max_mean = 0.4
boxes = [[0, 165, 232, 240]]
# the door opens on tick 900 and draws the original's rseed differently, as every door does (oracle/re2.md)
ignore = [[900, "rseed"]]
expect = "match"
record = "--no-enemies --life 200 --warp 20B:-1814:0:-12103:3029 --give 2:0x5B:1 --give 3:0x14:30"

