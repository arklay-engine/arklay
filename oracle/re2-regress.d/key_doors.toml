# Sce_Door's partner test (0x4E946F): Claire with Sherry following and lost (her `+0x21D & 0x20`) presses room 21B's door 3,
# and the door puts up "I can't leave Sherry alone." (door message 8) and stays shut. sherry_21b_lost's warp and flags.
[[run]]
name = "sherry_21b_door"
room = "21B"
player = 1
character = 1
sound = false
ticks = 700
input = "sherry_21b_door.txt"
input_shift = 344
setup = { pos = [-26159, 0, -18908], angle = 1024, health = 200, rnd = 6114, camera = 0, flags = [[3, 64], [3, 8], [3, 12]] }
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,es,spl,fgscn,fgstat,msg,fgkey"
expect = "match"
record = "--start claire --warp 21B:-26159:0:-18908:1024:0 --flag 3:64 --flag 3:8 --flag 3:12 --life 200"

# The three door messages without a key turn again, with their frames: the lock's message on two pages, "You unlocked
# it." and "It's locked from inside." are drawn where Mess_set's attr 0x100 puts them (oracle/re2-deviations.md, "Messages").
[[run]]
name = "locked_door_20B_draw"
room = "20B"
setup_script = "locked_door_20B.lua"
input = "locked_door_20B.txt"
input_shift = 344
ticks = 800
fields = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,snd,msg,fgkey,fgstat"
frames = [360, 799]
# 0.13 measured, the messages on the original's pixels
frame_max_mean = 0.20
# The message on screen (365 to 650): 0.14
frame_windows = [[365, 650, 0.20]]
expect = "match"
record = "--no-enemies --life 200 --warp 20B:-1814:0:-12103:3029"

