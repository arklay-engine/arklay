# Leon A's route from the darkroom (208) to the S.T.A.R.S. office (115), room by room from warps (oracle/re2.md,
# "Leon A to the S.T.A.R.S. office"), each warp starting Leon as route_200_208 leaves him: 156 life, 2 rounds in the
# handgun and 38 spare, the ink ribbons in slot 3.

# Rooms 208, 207 and 10C: out of the darkroom, back past 207's dead zombies to the stairs door, up 10C's stairs, the
# statue puzzle and the Red Jewel, and door 2 into 114.
[[run]]
name = "leon_a_208_114"
room = "208"
setup_script = "leon_a_208_114.lua"
input = "leon_a_208_114.txt"
input_shift = 344
input_drop_early = true
ticks = 4150
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,inv,snd,bgm,xavol,msg,hk,fgstat,fgitem,fgcom,om0,om1,om2,zm0,zm1,zm2,zm3"
frames = [360, 4149]
# the doors' frames count only in the whole run's mean: 10C's stairs door (type 4) draws its steps wider and brighter than the original's (oracle/re2-deviations.md, "The stairs door's frames"), a mean of 5.5 over its 210 ticks
frame_max_mean = 0.95
# each room on its own, from its hand back to its door's press: 208, 207, 10C, 114
frame_windows = [[360, 448, 0.2], [789, 939, 0.25], [1150, 3723, 0.6], [4066, 4149, 0.2]]
expect = "match"
ignore = [
  # room 114's slot 0, which stands: its `Spd` is what the slot held before (the slots' leftovers,
  # oracle/re2-deviations.md, "What a zombie's slot held before")
  [3850, 4149, "zm0"],
]
record = "--warp 208:-19005:0:-16920:1029:0 --flag 8:141 --flag 6:71 --flag 6:72 --flag 6:115 --flag 6:116 --life 156 --give 0:2:2 --give 2:0x14:38 --give 3:0x1E:3"

# Rooms 114 and 115: down the corridor past its three zombies to door 1, then the desk: Chris's Diary, the Unicorn
# Medal and the scene with Claire. The voice lines end by the recording's clock, so the run takes their lengths from
# the reference.
[[run]]
name = "leon_a_114_115"
room = "114"
setup_script = "leon_a_114_115.lua"
input = "leon_a_114_115.txt"
input_shift = 344
input_drop_early = true
ticks = 3250
voice_from_ref = true
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,inv,snd,bgm,xavol,em,msg,hk,om0,om1,om2,scene,fl,fgstat,fgitem,fgcom,zm0,zm1,zm2"
frames = [360, 3249]
# 0.97 measured; the scene's Leon and Claire, close to the camera, are most of it (oracle/re2.md, "Room 115's scene")
frame_max_mean = 1.05
# 114 from the warp to the door's press, then 115 from the hand back to the medal's question and from there to the end, past the scene (its frames 1342 to 1345 keep the desk's close-up, as the original's do: oracle/re2-deviations.md, "The frames of a cut")
frame_windows = [[360, 435, 0.45], [778, 1341, 0.3], [1342, 3249, 1.05]]
expect = "match"
ignore = [
  # the head through the door while it was turned toward a zombie: the original places it at 115's setup, arklay keeps
  # 114's until the door's last frame (oracle/re2-deviations.md, "The head through a door")
  [562, 775, "pneck"],
]
record = "--warp 114:-25260:0:-3420:2048:5 --life 156 --give 0:2:2 --give 2:0x14:38 --give 3:0x1E:3 --give 4:0x33:1"

# Leon A's route from the new game to the Unicorn Medal in the S.T.A.R.S. office (115) in one run (oracle/re2.md, "Leon A to the S.T.A.R.S. office"): route_200_208's input to the ink ribbons' take in the darkroom, then leon_a_208_114's and leon_a_114_115's joined on from each door's hand back. The voice lines end by the recording's clock, so the run takes their lengths from the reference.
[[run]]
