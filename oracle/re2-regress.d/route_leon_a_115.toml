ignore = [
    # the head through 114's door 1 with the head turned toward a zombie (oracle/re2-deviations.md, "The head through a door")
    [24561, 24774, "pneck"],
    # `zd` (oracle/re2-deviations.md, "What a zombie's slot held before"): room 101's slots 3 and 4, whose works sit on memory from before the new game, until room 102's load, and room 103's slots 5 and 6 until room 200's load
    [482, 2751, "zd"], [8397, 8909, "zd"],
]
