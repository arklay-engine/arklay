# The title's OPTION screen (`0x44A040`, `Config_main` 0x44A0B0; oracle/re2.md, "The option screen"). `opt` is its trace: the task's step, the state, the menu's row, the sound page's row, a change's wait, the speaker mode, the sound quality, the two volumes and the arrows' five blink counts.

