# The effect pool (`esp`, oracle/re2.md, "The trace"). Each recording has three runs on one reference: the plain
# one compares the fields its recipe in oracle/re2.md documents as matching, the `esp_` one compares the whole
# pool, and the `esp_kinds_` one only the live count and which kinds and rows are out (`espn`, `espk`), which
# still compares when the slots' places part. Their first divergences are in docs/internals/deviations/re2.md, "Effects".

[[run]]
name = "street_shoot"
ref = "esp_street_shoot"
room = "new"
offset = 0
sound = false
# The game over ends at 1997; the original then returns to the title.
ticks = 1998
setup_script = "new_game.lua"
input = "street_shoot.txt"
fields = "rng,p.x,p.z,p.angle,p.beh,p.as,p.hp,zm0,zm1,zm2,zm3,zm4,zm5,fgroom,fgstat"
expect = "match"
record = ""

[[run]]
name = "esp_street_shoot"
room = "new"
offset = 0
sound = false
ticks = 1998
setup_script = "new_game.lua"
input = "street_shoot.txt"
fields = "esp"
expect = "match"
record = ""

[[run]]
name = "esp_kinds_street_shoot"
ref = "esp_street_shoot"
room = "new"
offset = 0
sound = false
ticks = 1998
setup_script = "new_game.lua"
input = "street_shoot.txt"
fields = "espn,espk,fgroom,fgstat"
expect = "match"
record = ""

