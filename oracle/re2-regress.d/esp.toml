# The effect pool (`esp`, oracle/re2.md, "The trace"). Each recording has three runs on one reference: the plain
# one compares the fields its recipe in oracle/re2.md documents as matching, the `esp_` one compares the whole
# pool, and the `esp_kinds_` one only the live count and which kinds and rows are out (`espn`, `espk`), which
# still compares when the slots' places part. Their first divergences are in docs/internals/deviations/re2.md, "Effects".

[[run]]
name = "street_shoot"
ref = "esp_street_shoot"
room = "new"
offset = 0
sound = false
# The game over ends at 1997; the original then returns to the title.
ticks = 1998
setup_script = "new_game.lua"
input = "street_shoot.txt"
fields = "rng,p.x,p.z,p.angle,p.beh,p.as,p.hp,zm0,zm1,zm2,zm3,zm4,zm5"
# slot 1's angle on the first tick (oracle/re2.md, street_shoot)
ignore = [[0, "zm1"]]
expect = "match"
record = ""

[[run]]
name = "esp_street_shoot"
room = "new"
offset = 0
sound = false
ticks = 1998
setup_script = "new_game.lua"
input = "street_shoot.txt"
fields = "esp"
expect = { tick = 0, fields = ["esp90"], note = "a burning zombie's flame (kind 5, row 3), placed on the part's point a unit out in x; the blood a shot starts (kind 0) stays where it starts where the original's follows the part's matrix (docs/internals/deviations/re2.md, \"Attached effects\")" }
record = ""

[[run]]
name = "esp_kinds_street_shoot"
ref = "esp_street_shoot"
room = "new"
offset = 0
sound = false
ticks = 1998
setup_script = "new_game.lua"
input = "street_shoot.txt"
fields = "espn,espk"
expect = "match"
record = ""

[[run]]
name = "water_walk_302"
ref = "esp_water_walk_302"
room = "302"
sound = false
ticks = 1400
setup = { pos = [-13500, 0, -8500], angle = 2048, health = 200, rnd = 6114, flags = [[1, 6]], camera = 0 }
input = "water_walk.txt"
input_shift = 344
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,zm0,zm1"
expect = "match"
record = "--warp 302:-13500:0:-8500:2048 --flag 1:6 --life 200"

