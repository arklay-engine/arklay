# Leon A's route from the Diamond Key (10B) down 110's ladder and through 207's Diamond door and 209 to the Heart Key in Marvin's office (202), room by room from warps (oracle/re2.md, "Leon A to the Heart Key", #644), each warp starting Leon as the run before leaves him, the first as route_200_diamond leaves him: 84 life, 6 rounds in the handgun and none spare, the knife, the ink ribbons in slot 2, the Red Jewel in slot 3, the valve handle in slot 4, the Diamond Key (two uses) in slot 5, and every common (bank 4), item (bank 8) and fg_key (bank 31) flag and the enemies' dead flags (bank 6) the route has raised by its end.

