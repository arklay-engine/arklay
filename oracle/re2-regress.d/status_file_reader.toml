[[run]]
name = "status_file_reader"
# the FILE page's reader (St_menu0_file subs 6 to 0x12) with files 1 and 3 in binder 0: open the binder, move its list, read file 1 to its end marker and back, read file 3 and close it, reopen the binder, turn to an empty one (oracle/re2.md, "Status screen"). The whole run's frames are reported, not judged, until the binders' zoom and the screen's slides are drawn; the page windows (file 1's, 676 to 1119, and file 3's, 1216 to 1379) are judged.
setup_script = "status_file_reader.lua"
input = "status_file_reader.txt"
input_shift = 344
ticks = 1900
fields = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ip,fl,snd,fgstat"
frames = [360, 1899]
frame_windows = [[676, 1119, 0.25], [1216, 1379, 0.35]]
expect = "match"
record = "--no-enemies --warp 102:-11378:0:-4587:0 --life 200 --file 0:1 --file 1:3"
