# The status screen's key repeat (`Pad_set`'s repeat counter, `Pad_rep_set(0xF01C, 0x60A)` at each `Status` start; oracle/re2.md, "Key repeat"). `prep` is the counter's trace: the flag, the count, the mask and the delays.

[[run]]
name = "status_repeat_102"
room = "102"
setup_script = "status_repeat_102.lua"
input = "status_repeat_102.txt"
input_shift = 344
input_drop_early = true
ticks = 820
fields = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,ip,inv,snd,prep"
frames = [360, 819]
expect = "match"
record = "--no-enemies --warp 102:-11378:0:-4587:0 --life 200 --give 2:0x26:1 --give 3:0x27:1 --give 4:0x14:30 --give 5:0x28:1"

