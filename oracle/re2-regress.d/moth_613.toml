# The giant moth (0x3A) and its larvae (0x3B) in room 613 (#888).

# The player stands at the door from 614.
[[run]]
name = "moth_613_stand"
room = "613"
sound = false
ticks = 2400
setup_script = "moth_613.lua"
input = "moth_613_stand.txt"
input_shift = 344
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,msg,zm*,fgstat"
expect = "match"
record = "--warp 613:-26300:0:-18000:0 --life 200"

# The player walks into area 3 (`main_02`), whose event sets the moth's scene word, and stands there.
[[run]]
name = "moth_613_walk"
room = "613"
sound = false
ticks = 2400
setup_script = "moth_613.lua"
input = "moth_613_walk.txt"
input_shift = 344
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,msg,zm*,fgstat"
expect = "match"
frames = [344, 1743]
# from the warp's first cut on, from the Wine slot: 0.26 before the wake, 0.67 to 1343 and 1.17 after, the moth's
# hover, grab and scales; its shadow, wings' beat and effect behaviour 0x4C (the scales' and dust's) aren't ported
frame_windows = [[350, 543, 0.35], [544, 1343, 0.9], [1344, 1743, 1.5]]
record = "--warp 613:-26300:0:-18000:0 --life 200"

# The same under HARD.
