# The walk in, then the handgun (weapon 2) aimed at the moth and fired every 25 ticks.
[[run]]
name = "moth_613_shots"
room = "613"
sound = false
ticks = 2400
setup_script = "moth_613_shots.lua"
input = "moth_613_shots.txt"
input_shift = 344
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,msg,inv,zm*,fgstat"
expect = "match"
frames = [344, 1343]
# from the warp's first cut on, from the Wine slot: 0.26 before the shots, 0.56 through them, the death and the body
frame_windows = [[350, 543, 0.35], [544, 1343, 0.75]]
record = "--warp 613:-26300:0:-18000:0 --life 200 --equip 2 --give 0:2:200"

