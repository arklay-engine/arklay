# Room 20B's safe: its keypad asks for four digits, each a question of form 2 (the digits 1 to 6, argument 2, so no cue
# for the answer), and main_02 cues each answer itself (main_03's se_on 266). The first try steers the first digit
# right round past 6 and back left past 1, and enters 2-2-1-6: the wrong code takes the safe's cut away (main_02's
# else). The second enters 2-2-3-6, which raises 4:37 and opens the safe (main_04): the Shotgun Shells' get-item
# window and the police station map's question, both answered Yes.
[[run]]
name = "question_20b"
room = "20B"
setup_script = "question_20b.lua"
input = "question_20b.txt"
input_shift = 344
ticks = 2000
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,mapfg,snd,msg,fgstat,fgcom,fgitem"
frames = [360, 1999]
frame_max_mean = 0.10
# 0.04 measured; the two tries' questions on screen (365 to 830 and 961 to 1348) 0.01 each
frame_windows = [[365, 830, 0.10], [961, 1348, 0.10]]
expect = "match"
record = "--no-enemies --life 200 --warp 20B:-11732:0:-10700:1024"

