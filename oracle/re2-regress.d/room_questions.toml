frames = [360, 1399]
# 0.43 measured, the question and its choices on the original's pixels
frame_max_mean = 0.50
# The questions on screen (365 to 520 and 601 to 720): 0.24 each; a choice row or page drawn wrong adds about 0.4
frame_windows = [[365, 520, 0.30], [601, 720, 0.30]]
expect = "match"
record = "--no-enemies --life 200 --warp 306:-17309:-5400:-20592:0"
