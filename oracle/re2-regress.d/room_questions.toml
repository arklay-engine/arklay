# at most) and Down takes 14 (to 0 at least); 80 is "Power supply OK". The first try steers the first switch round both
# ends and answers Up, Up, Up, Down, Down (72, "Power supply slightly low."); the second, from a step back, answers Up,
# Up, Down, Down, Up (80): 4:60, the sparks' sprites (sce_espr_on2) and cut 8. The gauge (object 2, which main_04 moves
