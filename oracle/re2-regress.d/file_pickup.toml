# A file taken in a room goes into the file list (St_get_file, oracle/re2.md, "Picking up a file"). The player stands at the file's area, facing it; the enemies are off. The frames are judged at each run's measured mean plus 0.1: the room, the picture's fade, the page (`St_disp_file2`) and the black under message 10. `file_pickup_115`'s frames end before the medal's get-item window (its routine 1 at 797).

[[run]]
name = "file_pickup_201"
room = "201"
setup_script = "file_pickup_201.lua"
input = "file_pickup_201.txt"
input_shift = 344
input_drop_early = true
ticks = 800
fields = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,fl,msg,snd,hk,fgstat,fgitem"
frames = [360, 799]
frame_max_mean = 0.41
expect = "match"
record = "--no-enemies --warp 201:-19000:0:-24850:1024 --life 200 --file 0:0"

