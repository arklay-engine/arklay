# Claire A's route from the S.T.A.R.S. office (115) back to the main hall's statue (200) and the Spade Key, room by room from warps (oracle/re2.md, "Claire A to the Spade Key"), recorded with --start claire and compared with player = 1 and character = 1, each warp starting Claire as route_claire_a_115 leaves her: 119 life, 6 rounds in the handgun and 35 spare, the ink ribbons in slot 3, the Red Jewel in slot 4, the Unicorn Medal in slot 5, the exit scene's 3:100, the route's common and item flags, and the dead flags of room 204's window licker (6:61) and room 207's four zombies. Rooms 114, 10C, 207, 205 and 204 run Leon's scripts; 115 is Claire's own, and 201's and 200's differ from Leon's only in two pick-ups off the route.

# Rooms 115, 114 and 10C: door 0 from the exit scene's end, up the empty corridor to door 2, east along 10C's upper floor, down the stairs and door 0 into 207.
[[run]]
name = "claire_a_115_207"
room = "115"
player = 1
character = 1
setup_script = "claire_a_115_207.lua"
input = "claire_a_115_207.txt"
input_shift = 344
input_drop_early = true
ticks = 1900
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,inv,snd,bgm,xavol,msg,hk,fgscn,fgstat,fgitem,fgroom,fgcom,em,zm0"
frames = [360, 1899]
# the doors' frames count only in the whole run's mean (1.26 measured): 10C's door 0 is the stairs door (type 4), which draws its steps wider and brighter than the original's (docs/internals/deviations/re2.md, "The stairs door's frames"), a mean of 4.1 over its 205 ticks, as on Leon
frame_max_mean = 1.4
# each room on its own, from its hand back to its door's press: 115 (from the warp), 114, 10C, and 207 from its hand back; measured 0.20, 0.12, 0.23 and 0.15
frame_windows = [[360, 363, 0.35], [705, 805, 0.25], [1147, 1539, 0.35], [1745, 1899, 0.3]]
expect = "match"
ignore = [
  # the doors' own ticks (oracle/re2.md, docs/internals/deviations/re2.md): 115's door 0, 114's door 2 and 10C's door 0
  [364, "rng"], [364, "rseed"], [806, "rng"], [806, "rseed"], [1540, "rng"], [1540, "rseed"],
  # the drawers' trace (`hk`) lists the room's objects too, so it differs over each load as the objects do
  [399, 489, "hk"], [841, 931, "hk"], [1575, 1667, "hk"],
]
record = "--start claire --warp 115:-26382:0:-18845:2768:2 --flag 3:100 --flag 6:61 --flag 6:71 --flag 6:72 --flag 6:115 --flag 6:116 --flag 4:5 --flag 4:6 --flag 4:7 --flag 4:26 --flag 4:27 --flag 4:38 --flag 4:39 --flag 4:48 --flag 4:70 --flag 4:85 --flag 4:86 --flag 4:102 --flag 4:135 --flag 4:152 --flag 8:3 --flag 8:5 --flag 8:20 --flag 8:32 --flag 8:101 --flag 8:104 --flag 8:141 --flag 8:152 --flag 8:154 --flag 8:195 --life 119 --give 0:3:6 --give 2:0x14:35 --give 3:0x1E:3 --give 4:0x33:1 --give 5:0x47:1"

