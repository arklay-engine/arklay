# Claire A's route from the Club Key (307) to the cog (20D), room by room from warps (#896). Each warp starts Claire
# as the run before leaves her, rng from 6114 as in every warp.

# Rooms 307, 212 and 211: from the Club Key's place to 307's ladder (aot 8's question, door 1), up into 212, east and
# south past its two dogs to door 0, and into 211, whose lickers (em 0x22) stand in for the dogs once 306's Club Key
# is taken (8:119).
