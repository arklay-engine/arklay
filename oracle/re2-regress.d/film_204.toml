# Room 204's licker window (event 9): the scene's `movie_on 10`, with the oracle's films off, holds two frames and closes and opens the sound (oracle/re2.md, "Films"). The zombie in slot 0 is switched off so that only the scene's licker (slot 1, `zm1`) runs. `movie` is compared in this run only: the other runs' doors and cut changes are not checked against it yet. `bgm` is left out: from `--room 204` the main's sequence holds 0xff where the original's warp leaves 1.
[[run]]
name = "film_204"
room = "204"
setup_script = "film_204.lua"
input = "film_204.txt"
input_shift = 344
ticks = 1000
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,zm1,snd,movie,fgroom,fgstat"
frames = [360, 999]
# the frames of the scene's cut_chg 7 (395, 396) are the old cut redrawn where the original holds the frame before it
frame_max_mean = 0.4
expect = "match"
record = "--warp 204:-15400:0:-8000:3072 --flag 4:85 --life 200 --no-enemies --keep-enemy 1"

# The same scene with the films on (`--config MovieEnable=1`): the film plays in no tick of the trace, since the game
# stands still under it, and its own `Pad_set`s (`ref.log` counts them) step the pad's repeat (oracle/re2.md, "Films").
[[run]]
name = "film_204_on"
room = "204"
setup_script = "film_204.lua"
input = "film_204.txt"
input_shift = 344
ticks = 1000
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,zm1,snd,movie,fgroom,fgstat,prep"
films_from_ref = true
# the repeat's count before the first press is the boot's, whose films ran on the wall clock
ignore = [[344, 359, "prep"]]
expect = "match"
record = "--warp 204:-15400:0:-8000:3072 --flag 4:85 --life 200 --no-enemies --keep-enemy 1 --config MovieEnable=1"

# Room 700's area 2 (event 7) with the films on: its fade, film 12 (whose attribute byte has `0x40`: `Bg_set_mode(2, 0)`
# after it) and what follows.
[[run]]
name = "film_700_on"
room = "700"
setup = { pos = [14500, 0, -1850], angle = 0, health = 200, rnd = 6114, camera = 0 }
input = "film_700.txt"
input_shift = 344
ticks = 600
fields = "room,cam,rng,p.x,p.y,p.z,p.angle,movie,fgroom,fgstat"
films_from_ref = true
frames = [344, 599]
expect = "match"
record = "--warp 700:14500:0:-1850:0 --life 200 --no-enemies --config MovieEnable=1"
