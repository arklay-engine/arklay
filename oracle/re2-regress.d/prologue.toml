# The prologue (`Prologue`, 0x4CEFF0), which a new game runs after the title's hand-over on tick 690
# (oracle/re2.md, "The prologue").

# Leon A's, left to run: the pictures, the fade out and the task's end on 4028, the tick arklay's title hands over on.
[[run]]
name = "prologue_leon"
ui = "title"
offset = 189
ticks = 4028
compare_from = 691
input = "prologue_leon.txt"
input_shift = 189
input_drop_early = true
fields = "pro,prs,prz,tfade,tfade3,snd"
frames = [691, 4027]
frame_max_mean = 0.15
expect = "match"
record = ""

