# The new game the skipped prologue starts: room 100's opening. `Game_loop`'s first tick is 1446, where the original
# has already set the room's enemies and effects; arklay sets them on that tick, so the comparison starts a tick on.
[[run]]
name = "prologue_leon_skip_play"
ref = "prologue_leon_skip"
ui = "title"
offset = 189
ticks = 2000
compare_from = 1447
input = "prologue_leon_skip.txt"
input_shift = 189
input_drop_early = true
fields = "room,cam,rseed,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ib,msg,fgstat,fgroom,zm0,zm1,zm2,zm3,zm4,zm5,zd,esp"
