# Leon A past the card, room 204's entry and its body (oracle/re2.md, "Leon A past the card"): from 201 through door 1,
# the door's hand back and `main_06`'s move, the corridor, the body's two checks and its 15 rounds, and the walk
# north to just short of area 7, where the window licker's scene (`main_09`) starts.
[[run]]
name = "leon_a_204_entry"
room = "201"
setup_script = "leon_a_204_entry.lua"
input = "leon_a_204_entry.txt"
input_shift = 344
ticks = 1700
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,inv,snd,zm0,zm1,zp"
frames = [380, 1699]
# 0.98 measured, 0.61 with the message box blanked: before #551 arklay drew room 204's body messages (a room's)
# 18 pixels left of and 10 above the original's (docs/internals/deviations/re2.md, "Messages"); the door's frames
# (model 9) are about 1.3
frame_max_mean = 1.05
boxes = [[0, 170, 320, 222]]
expect = "match"
# the door's own tick (oracle/re2.md, docs/internals/deviations/re2.md)
ignore = [[468, "rng"], [468, "rseed"]]
record = "--warp 201:-15773:0:-21630:2040:0 --life 200 --give 0:2:13 --give 2:0x14:39"
