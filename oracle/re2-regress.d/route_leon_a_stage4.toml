frame_windows = [[360, 1661, 1.9], [1792, 2127, 1.85], [2256, 2897, 0.45], [3026, 3799, 0.7]]
voice_from_ref = true
# `splayer_work` holds what the recorder's boot left in it until Ada's rejoin writes it on 1497; on the first tick of each load (402 on 1790, 403 on 2254) the original's follow point and `Dest` are not yet those both have from the next tick (#987)
# 404's four `se_on(2, 29, 259)` in `main_17` play room slot 0x1D unplaced, at its tone's level: the original's room bank pointers still point where `main_02`'s `rbj_reset` (`Replace_rdt`) moved the sections from, and the load's allocations after it overwrote that tone (the level reads 0xFFDB) (#991)
