# Leon A's route through stage 4, from 304, where Ada rejoins, to 40E's cable car (#667, part 6; oracle/re2.md, "Leon A through stage 4")

# Rooms 304, 402, 403 and 404: from 304's door 3 north into area 5 for Ada's rejoin (`main_06`, 3:97; the scene takes Leon up the stairs by `plc_dest`'s routine 0x12), east along the walkway and down off its edge to door 4, Ada following; through 402 north and up its step to door 2; through 403 to its handgun rounds and down its lift (`main_12`'s `aot_reset` moves door 1's target); and 404's ambush, where Ada becomes the player (Ada can't be warped in as the partner, so the run starts at 304)
[[run]]
name = "leon_a_304_404"
room = "304"
setup_script = "leon_a_304_404.lua"
input = "leon_a_304_404.txt"
input_shift = 344
input_drop_early = true
ticks = 3800
