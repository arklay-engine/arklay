# SPECIAL's EX.BATTLE on the title (oracle/re2.md, "The title"): the fade to Extreme Battle's title, its fade in and logo, its rows and level page, and each of its ways out. Boot records, compared from the title's first tick.

# Down to START, the level page, the level to 2 and back to 1, its EXIT and up again, and the confirm on level 2: the flash and fade to the hand-off on 1163, then the character's choice (`ExBattle`) and its confirm on Leon (1300), to the tick it ends (1345). The record was made before the choice's `exb` field.
[[run]]
name = "special_ex"
ui = "title"
offset = 189
# recorded for 2300 ticks
ticks = 1346
input = "special_ex.txt"
input_shift = 189
input_drop_early = true
fields = "ti,tlogo,tfade,tx,tfade2,tfade3,snd"
frames = [189, 1345]
expect = "match"
record = ""

