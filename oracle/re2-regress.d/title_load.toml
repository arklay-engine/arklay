# The title's LOAD GAME: `Mem_card` (0x4C57E0) in load mode (oracle/re2.md, "The load screen").

[[run]]
name = "title_load_empty"
ui = "title"
offset = 189
ticks = 1420
input = "title_load_empty.txt"
input_shift = 189
input_drop_early = true
fields = "ti,tlogo,tfade,tfade3,snd,sv,svs"
frames = [189, 1419]
expect = "match"
record = ""

# LOAD GAME with a save in the folder: the list's moves and name scroll on the save's row, the decide on it, the
# load (state 10), the screen's fade out and the title's hand-over to the game on tick 810.
[[run]]
name = "title_load_game"
ui = "title"
offset = 189
ticks = 811
input = "title_load_game.txt"
input_shift = 189
input_drop_early = true
saves_from = "save_200_new"
fields = "ti,tlogo,tfade,tfade3,snd,sv,svs,svb"
frames = [189, 810]
expect = "match"
record = ""

# The game a load starts: `title_load_game`'s load, then a walk and a turn in room 200. Compared from the game's
# first tick on, on the game's fields.
[[run]]
name = "title_load_play"
ui = "title"
offset = 189
ticks = 1100
compare_from = 818
input = "title_load_play.txt"
input_shift = 189
input_drop_early = true
saves_from = "save_200_new"
fields = "room,cam,rseed,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ib,msg,fgstat"
frames = [811, 1099]
# arklay poses the player as the save loads, the original on the first tick's move.
ignore = [[818, "mot"]]
expect = "match"
record = ""
