# The title's LOAD GAME: `Mem_card` (0x4C57E0) in load mode (oracle/re2.md, "The load screen").

[[run]]
name = "title_load_empty"
ui = "title"
offset = 189
ticks = 1420
input = "title_load_empty.txt"
input_shift = 189
input_drop_early = true
fields = "ti,tlogo,tfade,tfade3,snd,sv,svs"
frames = [189, 1419]
expect = "match"
record = ""

# LOAD GAME with a save in the folder: the list's moves and name scroll on the save's row, the decide on it, the
# load (state 10), the screen's fade out and the title's hand-over to the game on tick 810.
[[run]]
name = "title_load_game"
ui = "title"
offset = 189
ticks = 811
input = "title_load_game.txt"
input_shift = 189
input_drop_early = true
saves_from = "save_200_new"
fields = "ti,tlogo,tfade,tfade3,snd,sv,svs,svb"
frames = [189, 810]
frame_max_mean = 0.1
expect = "match"
record = ""

# The game a load starts: `title_load_game`'s load, then a walk and a turn in room 200. Compared from the game's
# first tick on, on the game's fields.
[[run]]
name = "title_load_play"
ui = "title"
offset = 189
ticks = 1100
compare_from = 818
input = "title_load_play.txt"
input_shift = 189
input_drop_early = true
saves_from = "save_200_new"
fields = "room,cam,rseed,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ib,msg,fgstat,tw"
frames = [811, 1099]
frame_max_mean = 0.05
# The black frames and the fade in: 0.1 over the six, from the fade's two frames.
frame_windows = [[818, 823, 0.2]]
expect = "match"
record = ""

# START in the loaded game's entry fade: 819's press is taken at once (the cue, `Game` 1), under the black frames,
# and the status screen's fade out waits for the entry fade's end, on 823; then cancel in the screen.
[[run]]
name = "title_load_start"
ui = "title"
offset = 189
ticks = 1000
compare_from = 818
input = "title_load_start.txt"
input_shift = 189
input_drop_early = true
saves_from = "save_200_new"
# No `mot`: arklay poses the player as the save loads, the original on its first move, which this START holds back.
fields = "room,cam,rseed,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,inv,ip,snd,fgstat"
frames = [811, 999]
# The status screen's own frames, as inv_check's.
frame_max_mean = 0.8
# The black frames, the fade in and the screen's fade out over the room.
frame_windows = [[818, 828, 0.1]]
expect = "match"
record = ""

# The save a main game's results write for the next scenario (result_leon_a_save's, Claire B's), loaded from the
# title: the B scenario's start.
[[run]]
name = "title_load_b"
ui = "title"
offset = 189
ticks = 900
compare_from = 818
input = "title_load_b.txt"
input_shift = 189
input_drop_early = true
saves_from = "result_leon_a_save"
fields = "room,cam,rseed,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ib,msg,fgstat,tw"
expect = { tick = 818, fields = ["fgstat", "mot", "p.angle", "p.beh", "p.x", "p.z", "rng", "rseed"], note = "Claire's B from the results' save: the original's Prologue_load takes the save's place 0xF/0x10 as a second scenario's start and runs Prologue_mv02 (fg_status 0x10 from 813), where arklay ends the prologue on any load and starts the room; the second scenarios' prologues are not ported (oracle/re2-deviations.md)" }
record = ""
