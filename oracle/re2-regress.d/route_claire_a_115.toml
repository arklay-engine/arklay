  # the stairs door (leon_a_208_114's load range covers the same tick, its 1148)
  [1234, "om0"],
  # the drawers' trace (`hk`) lists the room's objects too, so it differs over each load as the objects do
  [570, 660, "hk"], [1061, 1153, "hk"], [3913, 4003, "hk"],
]
record = "--start claire --warp 208:-19956:0:-19363:149:1 --flag 8:141 --flag 6:71 --flag 6:72 --flag 6:115 --flag 6:116 --life 119 --give 0:3:6 --give 2:0x14:20 --give 3:0x1E:3"

