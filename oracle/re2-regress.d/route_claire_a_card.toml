# Claire A from the new game to room 200's computer and the Blue Card Key's use, with the enemies on (oracle/re2.md, "The route"). No flags: the new game as it starts.

[[run]]
name = "route_claire_a_card"
room = "new"
character = 1
offset = 0
ticks = 14800
setup_script = "route_claire_a_card.lua"
input = "route_claire_a_card.txt"
