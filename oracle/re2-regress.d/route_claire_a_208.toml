# Claire A's route from the new game to the darkroom (208)'s typewriter in one run: route_claire_a_card's input to the
# Blue Card Key's use at room 200's computer, then the room runs above joined on from each door's hand back, through
# rooms 200, 201, 204, 205, 207 and 208. The voice lines end by the recording's clock, so the run takes their lengths
# from the reference.
[[run]]
name = "route_claire_a_208"
room = "new"
character = 1
offset = 0
ticks = 21300
setup_script = "route_claire_a_208.lua"
input = "route_claire_a_208.txt"
voice_from_ref = true
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,inv,snd,bgm,xavol,em,msg,hk,tw,zm0,zm1,zm2,zm3,zm4,zm5,zm6,zm7,zm8,zm9,zp,zd,fgstat,fgitem,fgroom,fgcom,pc"
frames = [0, 21299]
frame_max_mean = 0.85
# each room past the card on its own, from its hand back to its door's press: 200 from the card's, 201, 204, 205, 207 and 208
# measured 0.53, 0.24, 0.48, 0.20, 1.19 (the zombies close to cut 1's camera) and 0.46
frame_windows = [[14625, 15491, 0.6], [15858, 15982, 0.3], [16323, 17906, 0.55], [18247, 18684, 0.25], [19025, 20234, 1.25], [20575, 21299, 0.55]]
expect = "match"
record = "--start claire"
# the doors' own ticks (oracle/re2.md, docs/internals/deviations/re2.md):
# route_claire_a_card's ten, then 200, 201, 204, 205 and 207's
ignore = [
    [356, "rng"],
    [356, "rseed"],
    [2627, "rng"],
    [2627, "rseed"],
    [5527, "rng"],
    [5527, "rseed"],
    [6656, "rng"],
