# Claire A's route past the Blue Card Key, from room 200's computer to the darkroom (208), room by room from warps
# (oracle/re2.md, "Claire A past the card"). Rooms 204, 205, 207 and 208's scripts are Leon's.

# Room 200 after the card: from the computer's hand back, the counter's 30 rounds, the east ramp and door 1.
[[run]]
name = "claire_a_200_out"
room = "200"
player = 1
character = 1
setup_script = "claire_a_200_out.lua"
input = "claire_a_200_out.txt"
input_shift = 344
ticks = 1300
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,inv,snd,fgscn,fgstat,fgitem"
# from the camera's leaving the upper floor's scrolled cut to the door; 0.09 measured
frames = [970, 1209]
frame_max_mean = 0.2
expect = "match"
ignore = [[1210, "rng"], [1210, "rseed"]]
record = "--start claire --no-enemies --warp 200:-14847:-1800:1892:2136:6 --flag 4:6 --flag 4:7 --flag 4:102 --flag 4:70 --life 200 --give 0:3:7 --give 2:0x14:6"

