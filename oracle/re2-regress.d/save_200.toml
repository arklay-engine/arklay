[[run]]
name = "save_200_new"
room = "200"
# the save screen from room 200's typewriter: decide on "new file", the write, the label's reveal, the wait, the exit and the return (oracle/re2.md, "The save screen")
setup_script = "typewriter_200_ribbon.lua"
input = "save_200_new.txt"
input_shift = 344
ticks = 1100
fields = "room,cam,rseed,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ib,snd,msg,tw,gm,fgstat,sv"
frames = [540, 1099]
saves = true
frame_max_mean = 1.6
expect = "match"
record = "--no-enemies --warp 200:-12200:-1800:-1900:1024 --flag 4:6 --life 200 --give 2:0x1E:3"

