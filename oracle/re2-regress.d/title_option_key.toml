# The option screen's KEYCONFIG page (`Config_main`'s states 2 and 9 to 0xF; oracle/re2.md, "The option screen"). `kc` is the page's trace: state 9's count, the panel's offset, the choice, and the key table being edited; `kcm` is the player's model beside the list: its routines, place, turn, motion and weapon, and the page's statics that drive it. The keyboard's own arrows (`kbup` and the rest in the inputs) are arklay's directions, and `keys` is config.ini's `KeyDef` and `JoyDef_Emulated` in the install the references were recorded from, which the page lists. `seed` is the title generator's first value, which the records took from the clock: OPTION's draw picks the model's character from it, Claire in the first run and Leon in the second. On the page the list and the panel are the original's pixels (a mean of 0.01 inside the panel), and what differs is the model: it's lit by the page's own lights, and drawn at 320 x 240 unfiltered where the original draws at 640 x 480, and Claire's hair isn't ported (#807). Without the model the page's windows were 2.05 and 2.50.

[[run]]
name = "title_option_key"
ui = "title"
offset = 189
ticks = 1060
input = "title_option_key.txt"
input_shift = 189
input_drop_early = true
seed = 0x80000000
fields = "ti,tlogo,tfade,snd,opt,kc,kcm"
frames = [189, 1059]
frame_max_mean = 0.91
frame_windows = [[189, 439, 0.15], [440, 1059, 1.22]]
expect = "match"
keys = { keys = "68 62 64 66 00 4D 00 49 00 00 4F 4A 5A 4B 00 00 00 00 00 00 00 00 00 00 00 26 28 25 27 0D 20 1B", pad = "00 10 00 00 00 40 00 00 00 80 00 00 00 20 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 80 00 00 00 00 08 00 00 44 00 00 00 00 00 00 00 00 01 00 00 10 00 00 00 02 00 00 00 00 00 00 00 00 00 00 00 08 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00" }
record = "--config 'KeyDef=68 62 64 66 00 4D 00 49 00 00 4F 4A 5A 4B 00 00 00 00 00 00 00 00 00 00 00 26 28 25 27 0D 20 1B' --config 'JoyDef_Emulated=00 10 00 00 00 40 00 00 00 80 00 00 00 20 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 80 00 00 00 00 08 00 00 44 00 00 00 00 00 00 00 00 01 00 00 10 00 00 00 02 00 00 00 00 00 00 00 00 00 00 00 08 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00'"

