# `Status`'s start (`0x501BD0`), which every status task runs on its sixth tick: with scenario flag 3:162 (the G-Virus gone) Leon's
# personal slot is the lighter again, and the Side Pack's item flag (8:63) makes the inventory ten slots. The status screen's own start,
# and the get-item window's (oracle/re2.md, "Items").

[[run]]
name = "status_start_102"
room = "102"
setup_script = "status_start_102.lua"
input = "status_start_102.txt"
input_shift = 344
ticks = 760
fields = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ip,snd,fgstat"
frames = [360, 759]
# Measured: 0.02. The ten slots' frame drawn as eight's gives 0.60.
frame_max_mean = 0.10
expect = "match"
record = "--no-enemies --warp 102:-11378:0:-4587:0 --give 10:0x52:1 --flag 3:162 --flag 8:63 --life 200"

[[run]]
name = "status_start_item_102"
room = "102"
setup_script = "status_start_102.lua"
input = "item_take_102.txt"
input_shift = 344
ticks = 1000
fields = "room,cam,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,snd,fgstat,fgitem"
frames = [360, 999]
# Measured: 0.02, as item_take.
frame_max_mean = 0.10
expect = "match"
record = "--no-enemies --warp 102:-11378:0:-4587:0 --give 10:0x52:1 --flag 3:162 --flag 8:63 --life 200"

# The item box is a status task too: opened as the first one since the flag, its inventory side is ten slots.
