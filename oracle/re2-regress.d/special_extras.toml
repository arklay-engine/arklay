# An extra mode's death and the title after it (oracle/re2.md, "The 4th Survivor and To-fu"): special_4th_walk's start,
# then up room 304's ledge and stairs and through the platform's door into room 303, whose zombies kill HUNK. The game
# over ends as a game's does (`Game_loop`'s `0x4BFE5D`), and `Init_global` keeps `fg_system`'s 8, so `Capcom_logo`
# goes back to the 4th Survivor's title (`title_mv_state` 3), not to `Title_init`.
[[run]]
name = "special_4th_die"
ui = "title"
boot = true
# This record's boot film picked Claire: `fg_status` bit 31, under which room 304 is disc 1's.
seed = 0x80000000
offset = 0
ticks = 5700
compare_from = 5110
input = "special_4th_die.txt"
voice_from_ref = true
fields = "ti,tlogo,tfade,tsel,tx,tfade2,tfade3,snd"
frames = [1269, 5699]
expect = "match"
record = ""

# The same record's game, from `Game_loop`'s first tick to the game over's end.
[[run]]
name = "special_4th_die_play"
ref = "special_4th_die"
ui = "title"
boot = true
seed = 0x80000000
offset = 0
ticks = 5110
compare_from = 1276
input = "special_4th_die.txt"
voice_from_ref = true
fields = "room,cam,rseed,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ib,msg,fgstat,fgroom,zm0,zm1,zm2,zm3,zm4,zd,esp,pl"
expect = "match"

