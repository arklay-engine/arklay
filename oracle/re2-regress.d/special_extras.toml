# SPECIAL's extras on the title (oracle/re2.md, "The title"): the confirm on 4TH or TO-FU, the fade to their own title, its logo and its START or EXIT, and SPECIAL's layouts for config.ini's SPECIAL below 15. Boot records, compared from the title's first tick.

[[run]]
name = "special_4th"
ui = "title"
offset = 189
# recorded for 1300 ticks; START hands off to the new game on 1270, which arklay doesn't port
ticks = 1270
input = "special_4th.txt"
input_shift = 189
input_drop_early = true
fields = "ti,tlogo,tfade,tx,tfade2,tfade3,snd"
frames = [189, 1269]
expect = "match"
record = ""

