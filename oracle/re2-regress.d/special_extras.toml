# SPECIAL's extras on the title (oracle/re2.md, "The title"): the confirm on 4TH or TO-FU, the fade to their own title, its logo and its START or EXIT. Boot records, compared from the title's first tick. SPECIAL's layouts for config.ini's SPECIAL below 15 have no run: the original exits before its first tick with SPECIAL at 0x0 to 0x5 (oracle/re2.md).

[[run]]
name = "special_4th"
ui = "title"
offset = 189
# recorded for 1300 ticks; START hands off to the new game on 1270, which arklay doesn't port
ticks = 1270
input = "special_4th.txt"
input_shift = 189
input_drop_early = true
fields = "ti,tlogo,tfade,tx,tfade2,tfade3,snd"
frames = [189, 1269]
expect = "match"
record = ""

[[run]]
name = "special_4th_exit"
ui = "title"
offset = 189
ticks = 1100
input = "special_4th_exit.txt"
input_shift = 189
input_drop_early = true
fields = "ti,tlogo,tfade,tx,tfade2,tfade3,snd"
frames = [189, 1099]
expect = "match"
record = ""

[[run]]
name = "special_tofu"
ui = "title"
offset = 189
# recorded for 1350 ticks; START hands off to the new game on 1310, which arklay doesn't port
ticks = 1310
input = "special_tofu.txt"
input_shift = 189
input_drop_early = true
fields = "ti,tlogo,tfade,tx,tfade2,tfade3,snd"
frames = [189, 1309]
expect = "match"
record = ""


# START on the 4th Survivor's title, on into its game: `Title_game_init`'s extras branch starts HUNK in room 304 with
# no prologue, and the room's opening scene plays (oracle/re2.md, "The 4th Survivor and To-fu"). From the boot, for
# the boot film's pick of the character, which the game keeps. Compared from `Game_loop`'s first tick, 1276.
[[run]]
name = "special_4th_play"
ui = "title"
boot = true
# This record's boot film picked Leon (`fg_status` bit 31 down).
seed = 0
offset = 0
ticks = 2000
compare_from = 1276
input = "special_4th_play.txt"
fields = "room,cam,rseed,rng,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,inv,ib,fgstat,fgroom,esp,pl"
frames = [1269, 1999]
expect = "match"
record = ""

