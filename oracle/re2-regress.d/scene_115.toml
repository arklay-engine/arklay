# Room 115's scene with Claire (oracle/re2.md, "Room 115's scene"). The player stands at the desk facing it, with the diary's and the medal's flags up so that the press goes straight to the scene; Claire is the room's own, so the enemies stay on. Voice lines are timed from the reference (`voice_from_ref`).

[[run]]
name = "scene_115"
room = "115"
setup = { pos = [-20000, 0, -18100], angle = 3072, health = 200, rnd = 6114, camera = 0, flags = [[8, 20], [8, 104]] }
input = "scene_115.txt"
input_shift = 344
input_drop_early = true
voice_from_ref = true
ticks = 1880
fields = "room,cam,rng,rseed,p.x,p.y,p.z,p.angle,p.beh,p.as,p.hp,mot,pneck,inv,snd,bgm,xavol,em,msg,scene"
frames = [360, 1879]
# 0.94 measured: the props on the hands are drawn and the desk's close-up stays up through cut 5's change with no load (oracle/re2.md, "Room 115's scene"); what is left is Leon and Claire close to the camera
frame_max_mean = 1.05
expect = "match"
record = "--warp 115:-20000:0:-18100:3072 --flag 8:20 --flag 8:104 --life 200"

